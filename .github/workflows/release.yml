# Builds the release downloads for Linux, Windows and macOS. A pushed tag `v*` attaches them
# to a draft release of that tag, its notes made from CHANGELOG.md, left for a person to sign
# (packaging/sign-release.sh) and publish; a manual run only keeps them as workflow artifacts.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Build as this version instead of Cargo.toml's, to try an update before a release (packaging/update-feed.sh)
        required: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
          - os: macos-latest
            name: macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev libasound2-dev libclang-dev pkg-config libxkbcommon-dev libwayland-dev libgl-dev
      - name: Test version
        if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml && rm Cargo.toml.bak
      - name: Version
        id: version
        shell: bash
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: packaging/release-notes.sh "${GITHUB_REF#refs/tags/v}" > "$RUNNER_TEMP/notes.md"
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = macos-universal ]; then
            cargo build --release --target aarch64-apple-darwin
            cargo build --release --target x86_64-apple-darwin
          else
            cargo build --release
          fi
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          v=${{ steps.version.outputs.version }}
          dir=kuulo-$v-${{ matrix.name }}
          mkdir -p dist/$dir
          cp README.md LICENSE dist/$dir/
          case "${{ matrix.name }}" in
            linux-x86_64)
              cp target/release/kuulo target/release/kuulo-cli packaging/kuulo.desktop packaging/install.sh dist/$dir/
              mkdir dist/$dir/icons
              cp crates/kuulo/assets/icon/kuulo-*.png crates/kuulo/assets/icon/kuulo.svg dist/$dir/icons/
              tar -C dist -czf dist/$dir.tar.gz $dir
              ;;
            windows-x86_64)
              cp target/release/kuulo.exe target/release/kuulo-cli.exe dist/$dir/
              (cd dist && 7z a -tzip -bso0 $dir.zip $dir)
              iscc=$(ls /c/Program\ Files*/Inno\ Setup*/ISCC.exe | head -1)
              MSYS_NO_PATHCONV=1 "$iscc" /Q /DVersion=$v 'packaging\kuulo.iss'
              ;;
            macos-universal)
              # The linker signs only the arm64 slice, and a bundle without a seal over its
              # resources reads as damaged, so the whole app is signed once it is assembled.
              app=dist/$dir/kuulo.app
              mkdir -p $app/Contents/MacOS $app/Contents/Resources
              for b in kuulo kuulo-cli; do
                lipo -create -output $app/Contents/MacOS/$b target/aarch64-apple-darwin/release/$b target/x86_64-apple-darwin/release/$b
              done
              sed "s/VERSION/$v/g" packaging/Info.plist > $app/Contents/Info.plist
              cp crates/kuulo/assets/icon/kuulo.icns $app/Contents/Resources/
              codesign --force --sign - $app/Contents/MacOS/kuulo-cli
              codesign --force --sign - $app
              codesign --verify --deep --strict --verbose=2 $app
              # The updater installs from a tarball of the app, which needs no mounting.
              COPYFILE_DISABLE=1 tar -C dist/$dir -czf dist/$dir.tar.gz kuulo.app
              ln -s /Applications dist/$dir/Applications
              hdiutil create -volname kuulo -srcfolder dist/$dir -format UDZO dist/$dir.dmg
              ;;
          esac
          ls -l dist/*.tar.gz dist/*.zip dist/*.dmg 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error
      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${GITHUB_REF#refs/tags/}
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --draft --title "kuulo ${tag#v}" --notes-file "$RUNNER_TEMP/notes.md"
          gh release upload "$tag" $(find dist -maxdepth 1 -type f -name "kuulo-*-${{ matrix.name }}*") --clobber
