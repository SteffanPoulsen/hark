[workspace]
resolver = "2"
members = ["crates/hark-core", "crates/hark-cli", "crates/hark"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/SteffanPoulsen/hark"

[workspace.dependencies]
hark-core = { path = "crates/hark-core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6", features = ["all"] }
rubato = "5"
ebur128 = "0.1"
rusqlite = { version = "0.40", features = ["bundled"] }
blake3 = "1"
walkdir = "2"
directories = "6"
cpal = "0.18"
flacenc = "0.5"
chrono = { version = "0.4", features = ["serde"] }
ureq = { version = "3", features = ["json"] }
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.36", features = ["persistence"] }
egui = "0.36"
egui_extras = { version = "0.36", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png"] }
egui-phosphor = { version = "0.14", features = ["regular", "fill"] }
rfd = "0.17"

[profile.release]
lto = "thin"
codegen-units = 4

[profile.dev.package."*"]
opt-level = 2

# Decoding, peaks and the mixer run per sample; unoptimised they make a dev build's loads
# many times slower than a release build's.
[profile.dev.package.hark-core]
opt-level = 2
