[package]
name = "hark"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "hark"
path = "src/main.rs"

[dependencies]
hark-core.workspace = true
anyhow.workspace = true
blake3.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
image.workspace = true
egui-phosphor.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
raw-window-handle = "0.6"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# "system" shares libwayland with winit, so the drag source runs on the window's own connection.
wayland-client = { version = "0.31", features = ["system"] }
wl-clipboard-rs = "0.9"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
drag = "2"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5"
# The version `drag` builds on, so the Windows build carries one copy.
windows = { version = "0.52", features = ["implement", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }
png = "0.18"
